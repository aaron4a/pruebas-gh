name: Version pyproject

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get strategy name and version from pyproject.toml
        id: get_meta
        run: |
          NAME=$(python3 -c "
          import sys
          tomllib = __import__('tomllib') if sys.version_info >= (3, 11) else __import__('tomli')
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['tool']['axion-strategy']['name'])
          ")
          VERSION=$(python3 -c "
          import sys
          tomllib = __import__('tomllib') if sys.version_info >= (3, 11) else __import__('tomli')
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['tool']['axion-strategy']['version'])
          ")
          GIT_TAG="${GITHUB_REF_NAME#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes for this tag
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip all --tag ${{ steps.get_meta.outputs.version }} --prepend CHANGELOG.md

      - name: Insert custom title above the generated section
        run: |
          TITLE="## ${{ steps.get_meta.outputs.name }} ${{ steps.get_meta.outputs.version }} (${{ steps.get_meta.outputs.git_tag }}) - $(date +%Y-%m-%d)"
          { echo "$TITLE"; echo ""; cat CHANGELOG.md 2>/dev/null || true; } > /tmp/tmp_changelog.md
          mv /tmp/tmp_changelog.md CHANGELOG.md

      - name: Open PR with the updated file
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: regenerate CHANGELOG.md"
          title: "docs: regenerate complete"
          body: Auto-generated full changelog rebuild.
          branch: changelog-regenerate
          add-paths: CHANGELOG.md
          base: main