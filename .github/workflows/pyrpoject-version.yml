name: Version pyproject

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get strategy version from pyproject.toml
        id: get_tag
        run: |
          VERSION=$(python3 -c "
          import sys
          tomllib = __import__('tomllib') if sys.version_info >= (3, 11) else __import__('tomli')
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['tool']['axion-strategy']['version'])
          ")
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes for this tag
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header --tag ${{ steps.get_tag.outputs.tag }} --prepend CHANGES.md