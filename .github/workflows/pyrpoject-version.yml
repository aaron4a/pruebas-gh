name: Version pyproject

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.detect.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)
          if [ -z "$PREV_TAG" ]; then
            REF=$(git rev-list --max-parents=0 HEAD)
          else
            REF="$PREV_TAG"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Detect changed strategy packages
        uses: dorny/paths-filter@v4
        id: detect
        with:
          base: ${{ steps.prev_tag.outputs.ref }}
          ref: ${{ github.ref }}
          filters: |
            chau:
              - 'chau/**'
              - '!chau/CHANGELOG.md'
            hola:
              - 'hola/**'
              - '!hola/CHANGELOG.md'

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ${{ fromJson(needs.detect-changes.outputs.folders) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify package directory exists
        run: |
          if [ ! -d "${{ matrix.folders }}" ]; then
            echo "::error::${{ matrix.folders }} does not exist. Filter key in strategies-automatic-deploy.yml is out of sync with the actual folder name."
            exit 1
          fi

      - name: Get strategy name and version from pyproject.toml
        id: get_meta
        run: |
          NAME=$(python3 -c "
          import sys
          tomllib = __import__('tomllib') if sys.version_info >= (3, 11) else __import__('tomli')
          with open('${{ matrix.folders }}/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['tool']['axion-strategy']['name'])
          ")
          VERSION=$(python3 -c "
          import sys
          tomllib = __import__('tomllib') if sys.version_info >= (3, 11) else __import__('tomli')
          with open('${{ matrix.folders }}/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['tool']['axion-strategy']['version'])
          ")
          GIT_TAG="${GITHUB_REF_NAME#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes for this tag
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: >-
            --latest --strip all --tag ${{ steps.get_meta.outputs.version }}
            --include-path "${{ matrix.folders }}/**"
            --prepend ${{ matrix.folders }}/CHANGELOG.md

      - name: Insert custom title above the generated section
        run: |
          TITLE="## ${{ steps.get_meta.outputs.name }} ${{ steps.get_meta.outputs.version }} (${{ steps.get_meta.outputs.git_tag }}) - $(date +%Y-%m-%d)"
          { echo "$TITLE"; echo ""; cat ${{ matrix.folders }}/CHANGELOG.md 2>/dev/null || true; } > /tmp/tmp_changelog_${{ matrix.folders }}.md
          mv /tmp/tmp_changelog_${{ matrix.folders }}.md ${{ matrix.folders }}/CHANGELOG.md

      - name: Open PR with the updated file
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: regenerate ${{ matrix.folders }}/CHANGELOG.md"
          title: "docs: regenerate ${{ matrix.folders }} changelog"
          body: Auto-generated changelog update for ${{ matrix.folders }}.
          branch: changelog-regenerate-${{ matrix.folders }}
          add-paths: ${{ matrix.folders }}/CHANGELOG.md
          base: main
