name: Get latest tag

on:
  workflow_dispatch: 

jobs: 
  get-latest-tag:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Get latest tag
          id: get_tag
          uses: actions-ecosystem/action-get-latest-tag@v1
        - name: Show tag
          run: |
            echo ${{ steps.get_tag.outputs.tag }}  