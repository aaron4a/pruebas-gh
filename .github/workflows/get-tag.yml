name: Get latest tag

on:
  workflow_dispatch: 

jobs: 
  get-latest-tag:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Get latest tag
          id: get_tag
          uses: actions-ecosystem/action-get-latest-tag@v1
        - name: Show tag
          run: |
            echo ${{ steps.get_tag.outputs.tag }}  
        - name: Remove 'v' prefix and set as output
          id: strip_v
          run: |
            original_string=${{ steps.get_tag.outputs.tag }}
            echo "version=${original_string#v}" >> $GITHUB_OUTPUT
        - name: Show version
          run: |
            echo ${{ steps.strip_v.outputs.version }}